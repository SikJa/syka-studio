[package]
name = "syka-asr"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Syka Studio's local speech recognition engine (Parakeet and others through transcribe.cpp)"
publish = false

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Each platform gets its GPU backend. Windows and Linux load backends as
# modules (dynamic-backends): without a Vulkan driver only the CPU registers,
# with a CPU variant per instruction set, so one build runs on any x86-64 PC.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["vulkan", "dynamic-backends"] }
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
