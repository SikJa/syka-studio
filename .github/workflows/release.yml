name: Windows release draft

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: syka-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.repository == 'SikJa/syka-studio'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Keep build caches and temporary files in the checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRuntime = Join-Path $env:GITHUB_WORKSPACE '.runtime/windows-build'
          foreach ($folder in 'tmp', 'npm-cache', 'electron-cache', 'electron-builder-cache', 'cargo') {
            New-Item -ItemType Directory -Force -Path (Join-Path $buildRuntime $folder) | Out-Null
          }
          "npm_config_cache=$(Join-Path $buildRuntime 'npm-cache')" >> $env:GITHUB_ENV
          "ELECTRON_CACHE=$(Join-Path $buildRuntime 'electron-cache')" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$(Join-Path $buildRuntime 'electron-builder-cache')" >> $env:GITHUB_ENV
          "CARGO_HOME=$(Join-Path $buildRuntime 'cargo')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:GITHUB_WORKSPACE '.runtime/screen-recorder-target')" >> $env:GITHUB_ENV
          "TEMP=$(Join-Path $buildRuntime 'tmp')" >> $env:GITHUB_ENV
          "TMP=$(Join-Path $buildRuntime 'tmp')" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check versions against the pushed tag
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release.mjs check "--tag=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Package and lockfile versions must match the release tag.' }
          node --version
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is required for the Windows screen recorder.' }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Provide local web build defaults
        run: |
          if (Test-Path -LiteralPath 'apps/web/.env.example') {
            Copy-Item -LiteralPath 'apps/web/.env.example' -Destination 'apps/web/.env'
          }

      - name: Windows x64 native screen recorder
        run: npm run build:native --workspace=@diffusionstudio/desktop

      # Until certificate provisioning is implemented, unsigned is explicit.
      # The matching publication job always creates a prerelease draft.
      - name: Build and verify the unsigned Windows beta
        run: npm run build:installer -- --unsigned

      - name: Upload the verified Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: syka-windows-x64-${{ github.ref_name }}
          path: |
            apps/desktop/out/make/Syka-Studio-x64-Setup.exe
            apps/desktop/out/make/RELEASES
            apps/desktop/out/make/*.nupkg
            apps/desktop/out/make/*.zip
            apps/desktop/out/make/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-windows:
    needs: build-windows
    if: github.repository == 'SikJa/syka-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build job has no repository write permission. Only this job creates
    # or updates a draft; neither job publishes a stable release.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the artifact from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "syka-windows-x64-$GITHUB_REF_NAME" --dir .runtime/release-assets

      - name: Verify versions, SHA256 and the complete Squirrel feed
        run: |
          node scripts/release.mjs check "--tag=$GITHUB_REF_NAME"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { verifyAssetBundle } from './scripts/build-windows.mjs';
          const directory = '.runtime/release-assets';
          const assets = await verifyAssetBundle(directory, process.env.GITHUB_REF_NAME.slice(1));
          writeFileSync('.runtime/release-assets.txt', assets.map(name => join(directory, name)).join('\n') + '\n');
          console.log(`Verified ${assets.length} release assets.`);
          NODE

      - name: Create or update the beta draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease > .runtime/release-info.json; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('.runtime/release-info.json', 'utf8'));
          if (release.isDraft !== true || release.isPrerelease !== true) {
            throw Error('An existing published release or stable draft will not be changed.');
          }
          NODE
          else
            cat > .runtime/release-notes.md <<'NOTES'
          Beta de Syka Studio para Windows x64, sin firma de código.

          Instalador: `Syka-Studio-x64-Setup.exe`.
          Incluye `RELEASES`, el paquete completo `.nupkg` y `SHA256SUMS`.
          En el primer arranque, las herramientas configuradas se descargan desde upstream y se verifican con SHA256 fijado.

          Este draft necesita revisión e instalación de prueba antes de publicarse.
          El canal estable no ofrece drafts ni prereleases como actualización.
          NOTES
            gh release create "$tag" --repo "$repo" --verify-tag --draft --prerelease \
              --latest=false --title "Syka Studio $tag · Windows beta" --notes-file .runtime/release-notes.md
          fi
          mapfile -t assets < .runtime/release-assets.txt
          if [ "${#assets[@]}" -lt 4 ]; then
            echo 'The complete installer, RELEASES, nupkg and checksum bundle is required.' >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease,url > .runtime/release-info.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('.runtime/release-info.json', 'utf8'));
          if (!release.isDraft || !release.isPrerelease) throw Error('Expected an unpublished beta draft.');
          console.log(`Draft ready for review: ${release.url}`);
          NODE
