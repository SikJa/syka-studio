name: Signed Windows release draft

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: syka-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.repository == 'SikJa/syka-studio'
    runs-on: windows-latest
    timeout-minutes: 75
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require the verified signing identity before building
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_SIGN_PUBLISHER: ${{ vars.WINDOWS_SIGN_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGN_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGN_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_ENABLED -ne 'true') { throw 'Windows public signing is not configured. This workflow will not produce an unsigned release.' }
          foreach ($name in @('WINDOWS_SIGN_PUBLISHER','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing setting: $name" }
          }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Keep build caches and temporary files in the checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRuntime = Join-Path $env:GITHUB_WORKSPACE '.runtime/windows-build'
          foreach ($folder in 'tmp', 'npm-cache', 'electron-cache', 'electron-builder-cache', 'cargo') {
            New-Item -ItemType Directory -Force -Path (Join-Path $buildRuntime $folder) | Out-Null
          }
          "npm_config_cache=$(Join-Path $buildRuntime 'npm-cache')" >> $env:GITHUB_ENV
          "ELECTRON_CACHE=$(Join-Path $buildRuntime 'electron-cache')" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$(Join-Path $buildRuntime 'electron-builder-cache')" >> $env:GITHUB_ENV
          "CARGO_HOME=$(Join-Path $buildRuntime 'cargo')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:GITHUB_WORKSPACE '.runtime/screen-recorder-target')" >> $env:GITHUB_ENV
          "TEMP=$(Join-Path $buildRuntime 'tmp')" >> $env:GITHUB_ENV
          "TMP=$(Join-Path $buildRuntime 'tmp')" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Authenticate the signing identity with Azure OIDC
        uses: Azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare the Microsoft signing client and metadata
        env:
          WINDOWS_SIGN_PUBLISHER: ${{ vars.WINDOWS_SIGN_PUBLISHER }}
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGN_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGN_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpointUri = [Uri]$env:SIGNING_ENDPOINT
          if ($endpointUri.Scheme -ne 'https' -or $endpointUri.Host -notmatch '^[a-z0-9-]+\.codesigning\.azure\.net$') { throw 'Use the HTTPS endpoint of the Artifact Signing account.' }
          $signingRoot = Join-Path $env:GITHUB_WORKSPACE '.runtime/windows-signing'
          New-Item -ItemType Directory -Force -Path $signingRoot | Out-Null
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.146 -Source https://api.nuget.org/v3/index.json -OutputDirectory $signingRoot -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft signing client installation failed.' }
          $dlib = Get-ChildItem -LiteralPath $signingRoot -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.0\.' } | Sort-Object { [Version]$_.Name } -Descending | Select-Object -First 1
          $signTool = Join-Path $sdk.FullName 'x64/signtool.exe'
          if (-not $dlib -or -not (Test-Path -LiteralPath $signTool -PathType Leaf)) { throw 'Missing x64 Microsoft signing client or Windows SDK SignTool.' }
          if ((Get-AuthenticodeSignature -LiteralPath $dlib.FullName).Status -ne 'Valid') { throw 'Untrusted signing client.' }
          $metadataPath = Join-Path $signingRoot 'metadata.json'
          @{
            Endpoint = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
            ExcludeCredentials = @('EnvironmentCredential','WorkloadIdentityCredential','ManagedIdentityCredential','SharedTokenCacheCredential','VisualStudioCredential','VisualStudioCodeCredential','AzurePowerShellCredential','AzureDeveloperCliCredential','InteractiveBrowserCredential')
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $metadataPath -Encoding utf8
          "WINDOWS_SIGNTOOL_PATH=$signTool" >> $env:GITHUB_ENV
          "WINDOWS_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "WINDOWS_SIGN_METADATA=$metadataPath" >> $env:GITHUB_ENV
          "WINDOWS_SIGN_PUBLISHER=$env:WINDOWS_SIGN_PUBLISHER" >> $env:GITHUB_ENV

      - name: Check versions against the pushed tag
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release.mjs check "--tag=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Package and lockfile versions must match the release tag.' }
          node --version
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is required for the Windows screen recorder.' }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Provide local web build defaults
        run: |
          if (Test-Path -LiteralPath 'apps/web/.env.example') {
            Copy-Item -LiteralPath 'apps/web/.env.example' -Destination 'apps/web/.env'
          }

      - name: Windows x64 native screen recorder
        run: npm run build:native --workspace=@diffusionstudio/desktop

      - name: Build and verify the signed Windows beta
        run: npm run build:installer

      - name: Upload the verified Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: syka-windows-x64-${{ github.ref_name }}
          path: |
            apps/desktop/out/make/Syka-Studio-x64-Setup.exe
            apps/desktop/out/make/RELEASES
            apps/desktop/out/make/*.nupkg
            apps/desktop/out/make/Syka-Studio-win32-x64-*.zip
            apps/desktop/out/make/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-windows:
    needs: build-windows
    if: github.repository == 'SikJa/syka-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build job has no repository write permission. Only this job creates
    # or updates a draft; neither job publishes a stable release.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the artifact from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "syka-windows-x64-$GITHUB_REF_NAME" --dir .runtime/release-assets

      - name: Verify versions, SHA256 and the complete Squirrel feed
        run: |
          node scripts/release.mjs check "--tag=$GITHUB_REF_NAME"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { verifyAssetBundle } from './scripts/build-windows.mjs';
          const directory = '.runtime/release-assets';
          const assets = await verifyAssetBundle(directory, process.env.GITHUB_REF_NAME.slice(1));
          writeFileSync('.runtime/release-assets.txt', assets.map(name => join(directory, name)).join('\n') + '\n');
          console.log(`Verified ${assets.length} release assets.`);
          NODE

      - name: Create or update the beta draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease > .runtime/release-info.json; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('.runtime/release-info.json', 'utf8'));
          if (release.isDraft !== true || release.isPrerelease !== true) {
            throw Error('An existing published release or stable draft will not be changed.');
          }
          NODE
          else
            cat > .runtime/release-notes.md <<'NOTES'
          Beta de Syka Studio para Windows x64 con firma Authenticode y sello de tiempo verificados.

          Instalador: `Syka-Studio-x64-Setup.exe`.
          Incluye `RELEASES`, el paquete completo `.nupkg` y `SHA256SUMS`.
          En el primer arranque, las herramientas configuradas se descargan desde upstream y se verifican con SHA256 fijado.

          Este draft necesita revisión e instalación de prueba antes de publicarse.
          El canal estable no ofrece drafts ni prereleases como actualización.
          NOTES
            gh release create "$tag" --repo "$repo" --verify-tag --draft --prerelease \
              --latest=false --title "Syka Studio $tag · Windows beta" --notes-file .runtime/release-notes.md
          fi
          mapfile -t assets < .runtime/release-assets.txt
          if [ "${#assets[@]}" -lt 4 ]; then
            echo 'The complete installer, RELEASES, nupkg and checksum bundle is required.' >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
          gh release view "$tag" --repo "$repo" --json isDraft,isPrerelease,url > .runtime/release-info.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('.runtime/release-info.json', 'utf8'));
          if (!release.isDraft || !release.isPrerelease) throw Error('Expected an unpublished beta draft.');
          console.log(`Draft ready for review: ${release.url}`);
          NODE
