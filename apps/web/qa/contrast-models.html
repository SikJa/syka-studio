<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syka · Contraste y modelos · QA aislada</title></head><body><div id="root"></div><script>
const listeners=new Map();
window.desktop={platform:'win32',on(channel,fn){const group=listeners.get(channel)||new Set();group.add(fn);listeners.set(channel,group);return()=>group.delete(fn)},send(channel,request){if(channel!=='main:request')return;const data=request.channel==='agent-chat:endpoint'?{url:'ws://127.0.0.1:5197/qa-no-network'}:undefined;queueMicrotask(()=>{for(const fn of listeners.get('main:response')||[])fn({id:request.id,ok:true,data})})}};
window.WebSocket=class {static OPEN=1;readyState=1;constructor(){setTimeout(()=>{this.onopen?.();this.onmessage?.({data:JSON.stringify({t:'harnesses',harnesses:[{id:'codex',label:'Codex',status:'ready',models:[{id:'qa-codex',label:'Modelo QA'}]},{id:'hermes',label:'Hermes',status:'ready',models:[{id:'openrouter:qa-a',label:'OpenRouter · Modelo A'},{id:'openrouter:qa-b',label:'OpenRouter · Modelo B'},{id:'openai-codex:qa-c',label:'ChatGPT or Codex Subscription · Modelo C'}]}]})})},0)}send(raw){const r=JSON.parse(raw);queueMicrotask(()=>this.onmessage?.({data:JSON.stringify({t:'res',id:r.id,ok:false,error:{code:'internal',message:'QA sin cuentas ni turnos'}})}))}close(){this.readyState=3}};
</script><script type="module" src="./contrast-models.tsx"></script></body></html>
